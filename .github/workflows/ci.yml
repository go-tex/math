name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Build, vet, race-test, and enforce 100% coverage. The deterministic spec.txt
  # conformance vectors are embedded and ruby-free, so they hold coverage at 100%
  # on every lane. A version-gated differential vs the `commonmarker` gem runs
  # only where a new-enough ruby is installed; it skips itself otherwise. The host
  # lane keeps cgo enabled so `-race` works; the arch lanes enforce CGO=0.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - if: runner.os != 'Windows'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # Validate the library on the six supported 64-bit targets. amd64/arm64 run
  # natively; the rest run the suite under qemu-user. CGO is disabled so these
  # lanes prove the pure-Go build.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go env GOARCH && go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, and apt refuses to
      # choose between its two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #   Package qemu-user-static is a virtual package provided by:
      #     qemu-user-binfmt-hwe 1:10.2.1+ds-1ubuntu4.4
      #     qemu-user-binfmt     1:10.2.1+ds-1ubuntu3.3
      #
      # `ubuntu-latest` migrated to Ubuntu 26 from 2026-10-19, so this lane went red
      # with nothing committed. ⚠ Installing a provider is NOT the fix: they register
      # binfmt handlers, they do not ship the `qemu-<arch>-static` binaries the matrix
      # names. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and both names are accepted.
      # go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      # loong64 runs here, and that is worth a note: go1.27.0/1.27.1 miscompile
      # SOME packages for loong64 (golang/go#81000 -- TRUNCDW is declared with a
      # floating-point output while producing an integer, so a byte-sized value
      # that inherits an FP register is spilled with an 8-byte MOVD and clobbers
      # its neighbour; the backport, golang/go#81147, is still open at the 1.27.2
      # milestone). go-gfx/gfx pins THIS lane to 1.26.4 for exactly that reason,
      # established on real LoongArch silicon.
      #
      # This package is not affected, and that is measured rather than assumed:
      # its loong64 qemu job passed on 2026-09-29 with `stable` resolving to
      # go1.27.1 ("Setup go version spec stable" / "go version go1.27.1"). The
      # defect needs a float-to-int conversion feeding a byte-sized value; there
      # is none here. If this lane ever fails on loong64 alone, pin it to 1.26.4
      # with a pointer to #81147 rather than looking for a bug in this code.
      - name: Test under qemu (${{ matrix.goarch }})
        run: |
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this lane. A lane that reports success for an
          # architecture it never ran is the one outcome this matrix exists to rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
            exit 1
          fi
          # Printed on purpose: without it, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "running ${{ matrix.goarch }} under $q"
          GOARCH=${{ matrix.goarch }} go test -exec="$q" ./...

  wasm:
    name: wasm (${{ matrix.goos }}/wasm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [js, wasip1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Build ${{ matrix.goos }}/wasm
        run: GOOS=${{ matrix.goos }} GOARCH=wasm go build ./...
